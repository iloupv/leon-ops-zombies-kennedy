// LEON MOD - the gamepad's sticks for RE4's Leon (gpad_sticksConfig thumbstick_leon): the left stick walks him forward /
// back and turns him (its side is a turn under the mod's tank controls, linear so a small push turns him slowly), the
// right stick the camera and the aim.
unbindallaxis
bindaxis A_LSTICK_X VA_SIDE MAP_LINEAR
bindaxis A_LSTICK_Y VA_FORWARD MAP_SQUARED
bindaxis A_RSTICK_X VA_YAW MAP_LINEAR
bindaxis A_RSTICK_Y VA_PITCH MAP_LINEAR
