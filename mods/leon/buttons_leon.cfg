// LEON MOD - the gamepad's buttons for RE4's Leon (gpad_buttonsConfig buttons_leon: leon.cfg runs it, and BO1 runs it
// again whenever it puts the profile's pad layout back - GamerProfile_ModGamepad). BO1's own layout (buttons_default)
// but for RE4's: A runs while held (back + A: the quick turn), B or R3 the knife (the jump command: under the mod's
// tank controls it is the knife, as Space is - CL_LeonQuickTurn), L3 runs with one press (CL_LeonRun). Leon never
// jumps, crouches or goes prone. BO1's vehicle layout (bind2: A switch seat, B handbrake, the triggers gas and reverse)
// goes: no vehicles here, and A's switch seat would change the character at the start of a match (_character's
// prompt reads that button).
bind BUTTON_A "+sprint"
bind BUTTON_B "+gostand"
bind BUTTON_X "+usereload"
bind BUTTON_Y "weapnext"
bind BUTTON_LSHLDR "+smoke"
bind BUTTON_RSHLDR "+frag"
bind BUTTON_START "togglemenu"
bind BUTTON_BACK "+scores"
bind BUTTON_LSTICK "+breath_sprint"
bind BUTTON_RSTICK "+gostand"
bind BUTTON_LTRIG "+speed_throw"
bind BUTTON_RTRIG "+attack"
bind DPAD_UP "+actionslot 1"
bind DPAD_DOWN "+actionslot 2"
bind DPAD_LEFT "+actionslot 3"
bind DPAD_RIGHT "+actionslot 4"
unbind2 BUTTON_A
unbind2 BUTTON_B
unbind2 BUTTON_LTRIG
unbind2 BUTTON_RTRIG
