// LEON MOD - the mod's settings, run at start by +exec leon.cfg (the Melty launch: its command line keeps only what the
// engine needs before this runs - bo1_zombies, net_ip, fs_game, bo1_rtmodels)
set leon_thirdperson 1
set player_tankControls 1
set cg_thirdPersonShoulder 18
set cg_thirdPersonShoulderUp 6
set cg_thirdPersonRange 42
set cg_drawVersion 0
set bo1_noloadhints 1
// the HUD and menus kept off the screen's edges: 5 % margins, a console's TV safe area
set safeArea_horizontal 0.9
set safeArea_vertical 0.9
// the playable characters, built at each level load (rtmodels/<name>.rlm - a missing one is left out, the engine
// lists those built in bo1_rtmodels_loaded, maps\leon\_character.gsc offers them)
set bo1_rtmodels "leon ada hunk luis"
set bo1_frontend_menu levels_zombie
// the gamepad on whenever one is plugged in (IN_GamepadsMove), with RE4's layout (buttons_leon.cfg,
// thumbstick_leon.cfg, kept through profile updates: GamerProfile_ModGamepad)
set leon_gamepad 1
set gpad_enabled 1
set gpad_buttonsConfig buttons_leon
set gpad_sticksConfig thumbstick_leon
exec buttons_leon.cfg
exec thumbstick_leon.cfg
